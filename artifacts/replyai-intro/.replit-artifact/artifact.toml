kind = "video"
previewPath = "/replyai-intro/"
title = "ReplyAI Intro Video"
version = "1.0.0"
id = "artifacts/replyai-intro"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/replyai-intro/" ]
localPort = 22043

[services.development]
run = "pnpm --filter @workspace/replyai-intro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/replyai-intro", "run", "build" ]
publicDir = "artifacts/replyai-intro/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22043"
BASE_PATH = "/replyai-intro/"
