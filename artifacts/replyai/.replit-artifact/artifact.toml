kind = "web"
previewPath = "/"
title = "ReplyAI"
version = "1.0.0"
id = "artifacts/replyai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19900

[services.development]
run = "pnpm --filter @workspace/replyai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/replyai", "run", "build" ]
publicDir = "artifacts/replyai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19900"
BASE_PATH = "/"
